<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<title>카페·블로그 HTML 빌더 v9</title>

<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;

  --surface-1:#f7f8fa;
  --surface-2:#ffffff;

  --text-primary:#171719;
  --text-secondary:#4b5563;
  --text-muted:#7b8494;

  --border:#e5e7eb;
  --border-strong:#cbd5e1;

  --fill-accent:#0A6EFA;
  --on-accent:#ffffff;

  --radius:6px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  background:var(--surface-2);
}

body{
  font-family:var(--font-sans);
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  min-height:620px;
}

/* 상단 메뉴 */
.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;

  border-bottom:0.5px solid var(--border);
  background:var(--surface-1);

  flex-wrap:wrap;
  flex-shrink:0;

  position:sticky;
  top:0;
  z-index:9999;
}

.topbar-title{
  font-size:13px;
  font-weight:600;
  color:var(--text-primary);
}

.btn{
  font-size:12px;
  padding:5px 11px;

  border-radius:var(--radius);
  border:0.5px solid var(--border-strong);

  background:var(--surface-2);
  color:var(--text-primary);

  cursor:pointer;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;

  transition:
    transform .1s ease,
    background .12s;
}

.btn:hover{
  background:var(--surface-1);
}

.btn:active{
  transform:scale(.95);
}

.btn.p{
  background:var(--fill-accent);
  color:var(--on-accent);
  border-color:var(--fill-accent);
}

.body{
  display:flex;
  flex:1;
  overflow:hidden;
  min-height:0;
}

/* 왼쪽 설정 */
.left{
  width:210px;
  flex-shrink:0;

  border-right:0.5px solid var(--border);
  background:var(--surface-1);

  overflow-y:auto;
  padding-bottom:100px;
}

.sh{
  font-size:10px;
  font-weight:600;
  color:var(--text-muted);

  padding:9px 12px 3px;

  text-transform:uppercase;
  letter-spacing:.06em;
}

.cr{
  padding:3px 12px;

  display:flex;
  flex-direction:column;
  gap:3px;
}

.cr label{
  font-size:11px;
  color:var(--text-secondary);
}

.cr input[type=text]{
  width:100%;

  font-size:11.5px;
  padding:5px 6px;

  border:0.5px solid var(--border);
  border-radius:var(--radius);

  background:var(--surface-2);
  color:var(--text-primary);
}

.tr{
  padding:5px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.tr label{
  font-size:11px;
  color:var(--text-secondary);
}

.tg{
  position:relative;

  width:28px;
  height:16px;

  cursor:pointer;
}

.tg input{
  opacity:0;
  width:0;
  height:0;
}

.tgs{
  position:absolute;
  inset:0;

  border-radius:8px;

  background:var(--border-strong);

  transition:.2s;
}

.tg input:checked + .tgs{
  background:var(--fill-accent);
}

.tgs:before{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  left:2px;
  top:2px;

  border-radius:50%;

  background:#fff;

  transition:.2s;
}

.tg input:checked + .tgs:before{
  transform:translateX(12px);
}

.div{
  border:none;
  border-top:0.5px solid var(--border);
  margin:5px 0;
}

/* 색상 */
.palette-wrap{
  padding:4px 12px;
}

.palette-row{
  display:flex;
  gap:3px;
  margin-bottom:3px;
}

.pc{
  width:18px;
  height:18px;

  border-radius:3px;

  cursor:pointer;

  border:2px solid transparent;

  flex-shrink:0;
}

.pc.on{
  border-color:#000;
  transform:scale(1.1);

  box-shadow:
    0 0 0 2px #fff inset;
}

.custom-color-row{
  display:flex;
  align-items:center;
  gap:6px;

  padding:3px 12px;
}

.custom-color-row label{
  font-size:11px;
  color:var(--text-secondary);
}

.custom-color-row input[type=color]{
  width:28px;
  height:22px;

  border:0.5px solid var(--border);
  border-radius:3px;

  cursor:pointer;
}

.custom-color-row input[type=text]{
  flex:1;

  min-width:0;

  font-size:11px;
  padding:4px 5px;

  border:0.5px solid var(--border);
  border-radius:var(--radius);

  background:var(--surface-2);
}

.color-preview{
  display:flex;
  align-items:center;
  gap:4px;

  padding:3px 12px 5px;
}

.cp-dot{
  width:14px;
  height:14px;

  border-radius:3px;
}

.cp-label{
  font-size:10px;
  color:var(--text-muted);
}

/* 스타일 선택 */
.style-grid{
  display:flex;
  gap:5px;
  flex-wrap:wrap;

  padding:4px 12px;
}

.style-thumb{
  min-width:56px;

  border:1.5px solid var(--border);
  border-radius:5px;

  padding:4px 6px;

  cursor:pointer;

  font-size:10px;
  color:var(--text-secondary);

  background:var(--surface-2);

  text-align:center;
}

.style-thumb.on{
  border-color:var(--fill-accent);
  background:var(--fill-accent);

  color:var(--on-accent);

  font-weight:600;
}

/* 본문 */
.mid{
  flex:1;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border-right:0.5px solid var(--border);
}

.panel-hd,
.preview-hd{
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);

  padding:5px 12px;

  border-bottom:0.5px solid var(--border);

  background:var(--surface-1);

  display:flex;
  align-items:center;
  justify-content:space-between;

  flex-shrink:0;
}

#editor{
  flex:1;

  border:none;
  outline:none;
  resize:none;

  padding:12px;

  font-family:var(--font-mono);
  font-size:12px;
  line-height:1.7;

  background:var(--surface-2);
  color:var(--text-primary);
}

/* 미리보기 */
.preview-panel{
  width:360px;
  flex-shrink:0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

#preview{
  flex:1;

  border:none;

  width:100%;

  background:#fff;
}

.bot{
  padding:5px 12px;

  border-top:0.5px solid var(--border);

  background:var(--surface-1);

  display:flex;
  align-items:center;
  justify-content:space-between;

  flex-shrink:0;
}

.st{
  font-size:11px;
  color:var(--text-muted);
}

/* 우측 아래 새탭 버튼 */
.floating-preview-btn{
  position:fixed;

  right:20px;
  bottom:24px;

  z-index:99999;

  border:0;
  border-radius:30px;

  padding:14px 20px;

  background:#0A6EFA;
  color:#fff;

  font-size:15px;
  font-weight:700;

  box-shadow:
    0 4px 16px rgba(0,0,0,.22);

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.floating-preview-btn:active{
  transform:scale(.96);
}

/* 모바일 하단 탭 */
.mobile-tabs{
  display:none;
}

.mobile-toast{
  display:none;
}

/* 모바일 */
@media(max-width:900px){

  #app{
    height:100dvh;
    min-height:0;

    padding-bottom:58px;
  }

  .topbar{
    flex-wrap:nowrap;

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

    padding:8px;
    gap:6px;

    scrollbar-width:none;
  }

  .topbar::-webkit-scrollbar{
    display:none;
  }

  .topbar-title{
    min-width:max-content;
    font-size:12px;
  }

  .topbar .btn{
    min-height:38px;

    padding:7px 10px;

    white-space:nowrap;

    font-size:12px;
  }

  .body{
    display:block;

    position:relative;

    overflow:hidden;
  }

  .left,
  .mid,
  .preview-panel{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    display:none;

    background:var(--surface-2);
  }

  .left.mobile-on{
    display:block;

    overflow-y:auto;

    -webkit-overflow-scrolling:touch;

    padding-bottom:120px;
  }

  .mid.mobile-on{
    display:flex;
  }

  .preview-panel.mobile-on{
    display:flex;
  }

  .sh{
    font-size:12px;

    padding:
      13px
      14px
      5px;
  }

  .cr,
  .tr,
  .palette-wrap,
  .custom-color-row,
  .style-grid{
    padding-left:14px;
    padding-right:14px;
  }

  .style-thumb{
    min-width:64px;

    font-size:12px;

    padding:8px 9px;
  }

  .cr label,
  .tr label{
    font-size:12px;
  }

  .cr input[type=text]{
    min-height:42px;

    padding:8px 10px;

    font-size:16px;
  }

  .pc{
    width:25px;
    height:25px;
  }

  .custom-color-row input[type=text]{
    font-size:16px;

    min-height:38px;
  }

  .custom-color-row input[type=color]{
    width:38px;
    height:34px;
  }

  .tg{
    width:42px;
    height:24px;
  }

  .tgs{
    border-radius:12px;
  }

  .tgs:before{
    width:20px;
    height:20px;
  }

  .tg input:checked + .tgs:before{
    transform:translateX(18px);
  }

  .panel-hd,
  .preview-hd{
    min-height:42px;

    padding:8px 12px;

    font-size:12px;
  }

  #editor{
    font-size:16px;

    line-height:1.7;

    padding:
      14px
      14px
      100px;
  }

  .bot{
    display:none;
  }

  .mobile-tabs{
    display:grid;

    grid-template-columns:
      repeat(3,1fr);

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:9999;

    height:
      calc(
        58px +
        env(safe-area-inset-bottom)
      );

    padding-bottom:
      env(safe-area-inset-bottom);

    background:
      rgba(255,255,255,.97);

    border-top:
      1px solid var(--border);

    box-shadow:
      0 -2px 12px rgba(0,0,0,.06);
  }

  .mobile-tab{
    border:0;

    background:transparent;

    font:inherit;

    font-size:12px;

    color:var(--text-muted);

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:2px;
  }

  .mobile-tab b{
    font-size:17px;

    line-height:1;
  }

  .mobile-tab.on{
    color:var(--fill-accent);

    font-weight:700;
  }

  .floating-preview-btn{
    right:14px;

    bottom:
      calc(
        72px +
        env(safe-area-inset-bottom)
      );

    padding:13px 18px;

    font-size:14px;
  }

  .mobile-toast{
    display:block;

    position:fixed;

    left:14px;
    right:14px;

    bottom:
      calc(
        128px +
        env(safe-area-inset-bottom)
      );

    z-index:100000;

    background:
      rgba(17,24,39,.94);

    color:#fff;

    padding:10px 12px;

    border-radius:9px;

    font-size:12px;
    line-height:1.45;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transform:translateY(8px);

    transition:.2s;
  }

  .mobile-toast.show{
    opacity:1;

    transform:translateY(0);
  }
}

/* 패드 중간 크기 */
@media(min-width:901px) and (max-width:1180px){

  .left{
    width:200px;
  }

  .preview-panel{
    width:320px;
  }

  .floating-preview-btn{
    right:18px;
    bottom:30px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="topbar">

    <span class="topbar-title">
      카페·블로그 HTML 빌더 v9
    </span>

    <button
      class="btn p"
      onclick="openNewTab()"
    >
      새 탭 확인
    </button>

    <button
      class="btn p"
      onclick="copyHtml()"
    >
      HTML 복사
    </button>

    <button
      class="btn"
      onclick="loadSample()"
    >
      샘플
    </button>

    <span
      style="
        width:1px;
        height:18px;
        background:var(--border-strong);
        margin:0 2px;
      "
    ></span>

    <button
      class="btn"
      onclick="loadTest('toc')"
    >
      목차만
    </button>

    <button
      class="btn"
      onclick="loadTest('h2')"
    >
      H2만
    </button>

    <button
      class="btn"
      onclick="loadTest('h3')"
    >
      H3만
    </button>

    <button
      class="btn"
      onclick="loadTest('table')"
    >
      표만
    </button>

    <button
      class="btn"
      onclick="loadTest('list')"
    >
      리스트만
    </button>

    <button
      class="btn"
      onclick="loadTest('qa')"
    >
      Q&A만
    </button>

    <button
      class="btn"
      onclick="clr()"
    >
      초기화
    </button>

  </div>

  <div class="body">

    <!-- 설정 -->
    <div class="left">

      <div class="sh">
        색상
      </div>

      <div
        class="style-grid"
        id="colormode-styles"
      >

        <div
          class="style-thumb on"
          onclick="setColorMode('single',this)"
        >
          기존
        </div>

        <div
          class="style-thumb"
          onclick="setColorMode('scheme',this)"
        >
          색조합
        </div>

        <div
          class="style-thumb"
          onclick="setColorMode('custom',this)"
        >
          마음대로
        </div>

      </div>

      <div id="mode-single">

        <div
          class="palette-wrap"
          id="palette"
        ></div>

        <div class="custom-color-row">

          <label>
            직접 입력
          </label>

          <input
            type="color"
            id="cpicker"
            value="#ff2d78"
            oninput="setColorFromPicker(this.value)"
          >

          <input
            type="text"
            id="chex"
            value="#ff2d78"
            maxlength="7"
            oninput="setColorFromHex(this.value)"
          >

        </div>

        <div class="color-preview">

          <div
            class="cp-dot"
            id="cp-dot"
            style="background:#ff2d78;"
          ></div>

          <div
            class="cp-dot"
            id="cp-light"
            style="
              background:#fff0f5;
              border:1px solid #ffb3cc;
            "
          ></div>

          <span
            class="cp-label"
            id="cp-hex"
          >
            #ff2d78
          </span>

        </div>

      </div>

      <div
        id="mode-scheme"
        style="display:none;"
      >

        <div
          id="scheme-list"
          style="
            padding:4px 12px;
            display:flex;
            flex-direction:column;
            gap:6px;
          "
        ></div>

      </div>

      <div
        id="mode-custom"
        style="display:none;"
      >

        <div
          id="slot-list"
        ></div>

      </div>

      <div class="div"></div>

      <div class="sh">
        목차 스타일
      </div>

      <div
        class="style-grid"
        id="toc-styles"
      >

        <div
          class="style-thumb on"
          data-v="box"
          onclick="pickStyle('toc',this)"
        >
          박스형
        </div>

        <div
          class="style-thumb"
          data-v="line"
          onclick="pickStyle('toc',this)"
        >
          왼쪽선
        </div>

        <div
          class="style-thumb"
          data-v="pill"
          onclick="pickStyle('toc',this)"
        >
          배지형
        </div>

        <div
          class="style-thumb"
          data-v="clean"
          onclick="pickStyle('toc',this)"
        >
          심플
        </div>

      </div>

      <div class="div"></div>

      <div class="sh">
        H2 소제목
      </div>

      <div
        class="style-grid"
        id="h2-styles"
      >

        <div
          class="style-thumb on"
          data-v="leftborder"
          onclick="pickStyle('h2',this)"
        >
          왼쪽선+배경
        </div>

        <div
          class="style-thumb"
          data-v="underline"
          onclick="pickStyle('h2',this)"
        >
          밑줄
        </div>

        <div
          class="style-thumb"
          data-v="fill"
          onclick="pickStyle('h2',this)"
        >
          꽉찬배경
        </div>

        <div
          class="style-thumb"
          data-v="badge"
          onclick="pickStyle('h2',this)"
        >
          배지
        </div>

        <div
          class="style-thumb"
          data-v="double"
          onclick="pickStyle('h2',this)"
        >
          이중선
        </div>

        <div
          class="style-thumb"
          data-v="shadow"
          onclick="pickStyle('h2',this)"
        >
          그림자
        </div>

      </div>

      <div class="div"></div>

      <div class="sh">
        H3 소소제목
      </div>

      <div
        class="style-grid"
        id="h3-styles"
      >

        <div
          class="style-thumb on"
          data-v="leftline"
          onclick="pickStyle('h3',this)"
        >
          왼쪽선
        </div>

        <div
          class="style-thumb"
          data-v="dot"
          onclick="pickStyle('h3',this)"
        >
          동그라미
        </div>

        <div
          class="style-thumb"
          data-v="arrow"
          onclick="pickStyle('h3',this)"
        >
          화살표
        </div>

        <div
          class="style-thumb"
          data-v="under"
          onclick="pickStyle('h3',this)"
        >
          밑줄
        </div>

        <div
          class="style-thumb"
          data-v="hash"
          onclick="pickStyle('h3',this)"
        >
          # 해시
        </div>

      </div>

      <div class="div"></div>

      <div class="sh">
        표 스타일
      </div>

      <div
        class="style-grid"
        id="table-styles"
      >

        <div
          class="style-thumb on"
          data-v="default"
          onclick="pickStyle('table',this)"
        >
          기본줄무늬
        </div>

        <div
          class="style-thumb"
          data-v="minimal"
          onclick="pickStyle('table',this)"
        >
          미니멀
        </div>

        <div
          class="style-thumb"
          data-v="dark"
          onclick="pickStyle('table',this)"
        >
          다크헤더
        </div>

        <div
          class="style-thumb"
          data-v="border"
          onclick="pickStyle('table',this)"
        >
          외곽선만
        </div>

        <div
          class="style-thumb"
          data-v="clean"
          onclick="pickStyle('table',this)"
        >
          줄무늬없음
        </div>

      </div>

      <div class="div"></div>

      <div class="sh">
        구성 요소
      </div>

      <div class="tr">

        <label>
          목차 자동 생성
        </label>

        <label class="tg">

          <input
            type="checkbox"
            id="toc"
            checked
            onchange="autoPreview()"
          >

          <span class="tgs"></span>

        </label>

      </div>

      <div class="tr">

        <label>
          CTA 버튼
        </label>

        <label class="tg">

          <input
            type="checkbox"
            id="cta"
            checked
            onchange="autoPreview()"
          >

          <span class="tgs"></span>

        </label>

      </div>

      <div class="div"></div>

      <div class="sh">
        CTA 설정
      </div>

      <div class="cr">

        <label>
          버튼1
        </label>

        <input
          type="text"
          id="ct1"
          value="👉 셀프개통 신청하기"
          oninput="autoPreview()"
        >

      </div>

      <div class="cr">

        <label>
          링크1
        </label>

        <input
          type="text"
          id="cu1"
          value="https://59man.shop"
          oninput="autoPreview()"

function hexToRgb(h){

  h=(h||'').replace('#','');

  if(h.length===3){

    h=h
      .split('')
      .map(function(x){
        return x+x;
      })
      .join('');
  }

  return[
    parseInt(h.slice(0,2),16),
    parseInt(h.slice(2,4),16),
    parseInt(h.slice(4,6),16)
  ];
}

function rgbToHex(r,g,b){

  function p(v){

    return(
      '0'+
      Math.max(
        0,
        Math.min(
          255,
          Math.round(v)
        )
      ).toString(16)
    ).slice(-2);
  }

  return '#'+p(r)+p(g)+p(b);
}

function mixWhite(hex,ratio){

  var c=hexToRgb(hex);

  if(c.some(isNaN)){
    return '#f5f5f5';
  }

  return rgbToHex(

    c[0]+(255-c[0])*ratio,
    c[1]+(255-c[1])*ratio,
    c[2]+(255-c[2])*ratio

  );
}

function getLight(c){
  return mixWhite(c,.9);
}

function getBorder(c){
  return mixWhite(c,.58);

function inlinemd(text){

  var ac=SC.accent;

  text=text.replace(

    /\*\*(.+?)\*\*/g,

    '<b style="color:'+
    ac+
    ';">$1</b>'

  );

  text=text.replace(

    /\*(.+?)\*/g,

    '<i>$1</i>'

  );

  text=text.replace(

    /\[([^\]]+)\]\(([^)]+)\)/g,

    '<a href="$2" target="_blank" style="color:'+
    ac+
    ';text-decoration:none;">$1</a>'

  );

  return text;
}

    olItems.forEach(function(it,idx){

      out+=
        '<div style="border:1px solid '+
        cb+
        ';border-radius:8px;padding:12px 16px;margin:8px 0;background:#fafafa;font-size:14.5px;line-height:1.8;">'+
        '<b style="color:'+
        c+
        ';">'+
        (idx+1)+
        '.</b> '+
        inlinemd(it)+
        '</div>';

    });

    olItems=[];

  }

  function flushTable(){

    if(!tableRows.length){
      return;
    }

    var tc=SC.table;
    var tcl=getLight(tc);
    var tcb=getBorder(tc);

    out+=
      '<table style="width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;">';

    tableRows.forEach(function(row,ri){

      if(
        /^[\|\s\-:]+$/.test(row)
      ){
        return;
      }

      var cells=
        row
          .split('|')
          .map(function(s){
            return s.trim();
          })
          .filter(Boolean);

      if(!cells.length){
        return;
      }

      out+='<tr>';

      cells.forEach(function(cell){

        if(ri===0){

          var bg=tc;
          var color='#fff';
          var border=
            '1px solid '+tc;

          if(tableStyle==='minimal'){

            bg=tcl;
            color=tc;
            border=
              '1px solid '+tcb;

          }

          if(tableStyle==='dark'){

            bg='#333';
            color='#fff';
            border=
              '1px solid #333';

          }

          if(tableStyle==='border'){

            bg='#fff';
            color=tc;
            border=
              '2px solid '+tc;

          }

          if(tableStyle==='clean'){

            bg=tcl;
            color=tc;
            border='none';

          }

          out+=
            '<th style="background:'+
            bg+
            ';color:'+
            color+
            ';padding:10px 14px;border:'+
            border+
            ';text-align:center;">'+
            inlinemd(cell)+
            '</th>';

        }else{

          var tdBorder=
            tableStyle==='clean'
            ? 'none'
            : tableStyle==='border'
              ? '1px solid '+tc
              : '1px solid '+tcb;

          out+=
            '<td style="padding:10px 14px;border:'+
            tdBorder+
            ';text-align:center;color:#333;">'+
            inlinemd(cell)+
            '</td>';

        }

      });

      out+='</tr>';

    });

    out+='</table>';

    tableRows=[];

  }

  while(i<lines.length){

    var t=
      lines[i].trim();

    if(t.startsWith('|')){

      flushUl();
      flushOl();

      tableRows.push(t);

      i++;
      continue;

    }else{

      flushTable();

    }

    if(t.startsWith('## ')){

      flushUl();
      flushOl();

      out+=
        makeH2(
          t.slice(3),
          'sec'+(++h2c)
        );

    }else if(
      t.startsWith('### ')
    ){

      flushUl();
      flushOl();

      out+=
        makeH3(
          t.slice(4)
        );

    }else if(
      t.startsWith('> ')
    ){

      flushUl();
      flushOl();

      out+=
        '<div style="background:'+
        cl+
        ';border:1px dashed '+
        c+
        ';border-radius:6px;padding:10px 14px;margin:14px 0;font-size:14px;line-height:1.8;">'+
        inlinemd(
          t.slice(2)
        )+
        '</div>';

    }else if(
      t.startsWith('- ') ||
      t.startsWith('* ')
    ){

      flushOl();

      ulItems.push(
        t.slice(2)
      );

    }else if(
      /^\d+\.\s/.test(t)
    ){

      flushUl();

      olItems.push(
        t.replace(
          /^\d+\.\s/,
          ''
        )
      );

    }else if(
      t===''
    ){

      flushUl();
      flushOl();

    }else{

      flushUl();
      flushOl();

      out+=
        '<p style="font-size:15px;line-height:1.9;color:#333;margin:10px 0;">'+
        inlinemd(t)+
        '</p>';

    }

    i++;
  }

  flushUl();
  flushOl();
  flushTable();

  var cta='';

  if(
    document.getElementById(
      'cta'
    ).checked
  ){

    var ct1=
      document.getElementById(
        'ct1'
      ).value;

    var cu1=
      document.getElementById(
        'cu1'
      ).value;

    var ct2=
      document.getElementById(
        'ct2'
      ).value;

    var cu2=
      document.getElementById(
        'cu2'
      ).value;

    var cc=SC.cta;

    cta=
      '<div style="background:'+
      getLight(cc)+
      ';border:1px solid '+
      cc+
      ';border-radius:8px;padding:16px;margin:20px 0;text-align:center;line-height:1.9;">'+
      '<a href="'+
      cu1+
      '" target="_blank" style="color:'+
      cc+
      ';font-weight:bold;text-decoration:none;">'+
      ct1+
      '</a>'+
      (
        ct2
          ? '&nbsp;&nbsp;<a href="'+
            cu2+
            '" target="_blank" style="color:'+
            cc+
            ';font-weight:bold;text-decoration:none;">'+
            ct2+
            '</a>'
          : ''
      )+
      '</div>';

  }

  return{
    toc:tocHtml,
    body:out,
    cta:cta
  };
}

/* =========================
   HTML 복사
========================= */

function copyHtml(){

  var src=
    buildContent();

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(src)
      .then(function(){

        setStatus(
          'HTML 코드 복사 완료'
        );

      })
      .catch(function(){

        openSource(src);

      });

  }else{

    openSource(src);

  }
}

function openSource(src){

  var w=
    window.open(
      '',
      '_blank'
    );

  if(!w){

    setStatus(
      '팝업이 차단됐습니다.'
    );

    return;
  }

  w.document.open();

  w.document.write(

    '<!doctype html>'+
    '<html>'+
    '<head>'+
    '<meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '</head>'+
    '<body style="margin:0;">'+

    '<textarea id="code" style="width:100%;height:100vh;border:0;padding:15px;font-size:16px;font-family:monospace;"></textarea>'+

    '</body>'+
    '</html>'

  );

  w.document.close();

  var ta=
    w.document.getElementById(
      'code'
    );

  ta.value=src;

  ta.focus();

  ta.select();
}

/* =========================
   상태
========================= */

function setStatus(msg){

  var st=
    document.getElementById(
      'st'
    );

  if(st){
    st.textContent=msg;
  }

  if(
    window.innerWidth<=900
  ){

    var t=
      document.getElementById(
        'mobile-toast'
      );

    if(t){

      t.textContent=msg;

      t.classList.add(
        'show'
      );

      clearTimeout(
        window.toastTimer
      );

      window.toastTimer=
        setTimeout(
          function(){

            t.classList.remove(
              'show'
            );

          },
          2400
        );
    }
  }
}

/* =========================
   모바일 탭
========================= */

function showMobilePanel(
  panelClass,
  btn
){

  if(
    window.innerWidth>900
  ){
    return;
  }

  document
    .querySelectorAll(
      '.left,.mid,.preview-panel'
    )
    .forEach(function(el){

      el.classList.remove(
        'mobile-on'
      );

    });

  var target=
    document.querySelector(
      '.'+panelClass
    );

  if(target){

    target.classList.add(
      'mobile-on'
    );

  }

  document
    .querySelectorAll(
      '.mobile-tab'
    )
    .forEach(function(x){

      x.classList.remove(
        'on'
      );

    });

  btn.classList.add(
    'on'
  );

  if(
    panelClass===
    'preview-panel'
  ){

    autoPreview();

  }
}

function syncResponsivePanels(){

  if(
    window.innerWidth<=900
  ){

    var active=
      document.querySelector(
        '.mobile-tab.on'
      );

    var cls=
      active
        ? active.dataset.panel
        : 'mid';

    document
      .querySelectorAll(
        '.left,.mid,.preview-panel'
      )
      .forEach(function(el){

        el.classList.remove(
          'mobile-on'
        );

      });

    var target=
      document.querySelector(
        '.'+cls
      );

    if(target){

      target.classList.add(
        'mobile-on'
      );

    }

  }else{

    document
      .querySelectorAll(
        '.left,.mid,.preview-panel'
      )
      .forEach(function(el){

        el.classList.remove(
          'mobile-on'
        );

      });

  }
}

window.addEventListener(
  'resize',
  syncResponsivePanels
);

window.addEventListener(
  'orientationchange',
  function(){

    setTimeout(
      syncResponsivePanels,
      200
    );

  }
);
