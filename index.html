<head>
<meta charset="utf-8">

<title>카페·블로그 HTML 빌더 v9 Mobile</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);}
#app{display:flex;flex-direction:column;height:100vh;min-height:620px;}
.topbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:0.5px solid var(--border);background:var(--surface-1);flex-wrap:wrap;flex-shrink:0;}
.topbar-title{font-size:13px;font-weight:500;color:var(--text-primary);}
.btn{font-size:12px;padding:5px 11px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:transform .1s ease,background .12s;}
.btn:hover{background:var(--surface-1);}
.btn:active{transform:scale(0.95);background:var(--surface-1);}
.btn.p{background:var(--fill-accent);color:var(--on-accent);border-color:var(--fill-accent);}
.btn.p:hover{opacity:.88;}
.btn.p:active{transform:scale(0.95);opacity:.8;}
.body{display:flex;flex:1;overflow:hidden;min-height:0;}

.left{width:210px;flex-shrink:0;border-right:0.5px solid var(--border);background:var(--surface-1);overflow-y:auto;padding-bottom:16px;}
.sh{font-size:10px;font-weight:500;color:var(--text-muted);padding:9px 12px 3px;text-transform:uppercase;letter-spacing:.06em;}
.cr{padding:3px 12px;display:flex;flex-direction:column;gap:3px;}
.cr label{font-size:11px;color:var(--text-secondary);}
.cr select{width:100%;font-size:11.5px;padding:3px 6px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);}
.cr input[type=text]{width:100%;font-size:11.5px;padding:3px 6px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);}
.tr{padding:3px 12px;display:flex;align-items:center;justify-content:space-between;}
.tr label{font-size:11px;color:var(--text-secondary);}
.tg{position:relative;width:28px;height:16px;cursor:pointer;}
.tg input{opacity:0;width:0;height:0;}
.tgs{position:absolute;inset:0;border-radius:8px;background:var(--border-strong);transition:.2s;}
.tg input:checked+.tgs{background:var(--fill-accent);}
.tgs:before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s;}
.tg input:checked+.tgs:before{transform:translateX(12px);}
.div{border:none;border-top:0.5px solid var(--border);margin:5px 0;}

.palette-wrap{padding:4px 12px;}
.palette-row{display:flex;gap:3px;margin-bottom:3px;}
.pc{width:18px;height:18px;border-radius:3px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .12s ease;}
.pc:hover{transform:scale(1.15);}
.pc:active{transform:scale(0.85);}
.pc.on{border-color:#000;transform:scale(1.15);box-shadow:0 0 0 2px #fff inset;}
.custom-color-row{display:flex;align-items:center;gap:6px;padding:3px 12px;}
.custom-color-row label{font-size:11px;color:var(--text-secondary);}
.custom-color-row input[type=color]{width:28px;height:22px;border:0.5px solid var(--border);border-radius:3px;cursor:pointer;padding:1px;}
.custom-color-row input[type=text]{flex:1;font-size:11px;padding:2px 5px;border:0.5px solid var(--border);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);}
.color-preview{display:flex;align-items:center;gap:4px;padding:3px 12px 5px;}
.cp-dot{width:14px;height:14px;border-radius:3px;}
.cp-label{font-size:10px;color:var(--text-muted);}

.style-grid{display:flex;gap:5px;flex-wrap:wrap;padding:4px 12px;}
.style-thumb{border:1.5px solid var(--border);border-radius:5px;padding:4px 6px;cursor:pointer;font-size:10px;color:var(--text-secondary);background:var(--surface-2);transition:transform .1s ease,border-color .12s,background .12s,color .12s;text-align:center;min-width:56px;}
.style-thumb:hover{border-color:var(--border-strong);}
.style-thumb:active{transform:scale(0.93);}
.style-thumb.on{border-color:var(--fill-accent);background:var(--fill-accent);color:var(--on-accent);font-weight:600;}

.mid{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:0.5px solid var(--border);}
.panel-hd{font-size:11px;font-weight:500;color:var(--text-muted);padding:5px 12px;border-bottom:0.5px solid var(--border);background:var(--surface-1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#editor{flex:1;border:none;outline:none;resize:none;padding:12px;font-family:var(--font-mono);font-size:12px;line-height:1.7;background:var(--surface-2);color:var(--text-primary);}
.preview-panel{width:360px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;}
.preview-hd{font-size:11px;font-weight:500;color:var(--text-muted);padding:5px 12px;border-bottom:0.5px solid var(--border);background:var(--surface-1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#preview{flex:1;border:none;width:100%;background:#fff;}
.bot{padding:4px 12px;border-top:0.5px solid var(--border);background:var(--surface-1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.st{font-size:11px;color:var(--text-muted);}

:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --surface-1:#f7f8fa;
  --surface-2:#ffffff;
  --text-primary:#171719;
  --text-secondary:#4b5563;
  --text-muted:#7b8494;
  --border:#e5e7eb;
  --border-strong:#cbd5e1;
  --fill-accent:#0A6EFA;
  --on-accent:#ffffff;
  --radius:6px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--surface-2);}
body{-webkit-text-size-adjust:100%;touch-action:manipulation;}
.mobile-tabs{display:none;}

@media (max-width:900px){
  #app{height:100dvh;min-height:0;padding-bottom:58px;}
  .topbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px;gap:6px;scrollbar-width:none;}
  .topbar::-webkit-scrollbar{display:none;}
  .topbar-title{min-width:max-content;font-size:12px;}
  .topbar .btn{min-height:38px;padding:7px 10px;white-space:nowrap;font-size:12px;}
  .body{display:block;position:relative;overflow:hidden;}
  .left,.mid,.preview-panel{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--surface-2);}
  .left.mobile-on,.mid.mobile-on,.preview-panel.mobile-on{display:flex;}
  .left.mobile-on{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px;}
  .mid.mobile-on{display:flex;}
  .preview-panel.mobile-on{display:flex;}
  .sh{font-size:12px;padding:13px 14px 5px;}
  .cr,.tr,.palette-wrap,.custom-color-row,.style-grid{padding-left:14px;padding-right:14px;}
  .style-thumb{font-size:12px;min-width:64px;padding:8px 9px;}
  .cr label,.tr label{font-size:12px;}
  .cr input[type=text],.cr select{font-size:16px;min-height:42px;padding:8px 10px;}
  .pc{width:25px;height:25px;}
  .custom-color-row input[type=text]{font-size:16px;min-height:38px;}
  .custom-color-row input[type=color]{width:38px;height:34px;}
  .tg{width:42px;height:24px;}
  .tgs{border-radius:12px;}
  .tgs:before{width:20px;height:20px;}
  .tg input:checked+.tgs:before{transform:translateX(18px);}
  .panel-hd,.preview-hd{min-height:42px;padding:8px 12px;font-size:12px;}
  #editor{font-size:16px;line-height:1.7;padding:14px 14px 90px;}
  #preview{min-height:0;}
  .bot{display:none;}
  .mobile-tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9999;
    height:58px;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.96);
    border-top:1px solid var(--border);
    box-shadow:0 -2px 12px rgba(0,0,0,.06);
  }
  .mobile-tab{border:0;background:transparent;font:inherit;font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;}
  .mobile-tab b{font-size:17px;line-height:1;}
  .mobile-tab.on{color:var(--fill-accent);font-weight:700;}
}

@media (min-width:901px) and (max-width:1180px){
  .left{width:200px;}
  .preview-panel{width:320px;}
}

.mobile-toast{display:none;}

@media (max-width:900px){
  .mobile-toast{
    display:block;
    position:fixed;
    left:14px;
    right:14px;
    bottom:70px;
    z-index:10000;
    background:rgba(17,24,39,.94);
    color:#fff;
    padding:10px 12px;
    border-radius:9px;
    font-size:12px;
    line-height:1.45;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
    transition:.2s;
  }
  .mobile-toast.show{opacity:1;transform:translateY(0);}
}
</style>
</head>

## 이건 H2 제목이에요

이 아래 줄이 본문 텍스트예요. **굵게**는 별표 두개, *기울임*은 별표 한개로 써요.

링크는 [이렇게](https://example.com) 대괄호+소괄호로 넣어요.

### 이건 H3 소제목이에요

H3 밑에는 이렇게 일반 문단을 씁니다.

> 이건 인용문/팁 박스예요. > 뒤에 한 칸 띄고 쓰면 돼요.

- 이건 글머리 리스트예요
- 항목이 여러 개면 이렇게 줄바꿔서
- 하이픈(-)이나 별표(*) 둘 다 돼요

1. 이건 번호 리스트예요
2. 숫자는 자동으로 매겨지니까
3. 그냥 1. 2. 3. 순서대로 쓰면 돼요

| 요금제 | 데이터 | 속도 |
|---|---|---|
| 396 | 10.3GB | 3Mbps |
| 459 | 20.3GB | 3Mbps |

Q. 이건 질문이에요?
A. 이건 답변이에요. Q./A. 형식으로 쓰면 자동으로 카드로 묶여요.</textarea>

function _hexToRgb(h){
  h=(h||'').replace('#','');

  if(h.length===3){
    h=h.split('').map(function(x){
      return x+x;
    }).join('');
  }

  return [
    parseInt(h.slice(0,2),16),
    parseInt(h.slice(2,4),16),
    parseInt(h.slice(4,6),16)
  ];
}

function _rgbToHex(r,g,b){

  function p(v){
    return (
      '0' +
      Math.max(
        0,
        Math.min(
          255,
          Math.round(v)
        )
      ).toString(16)
    ).slice(-2);
  }

  return '#'+p(r)+p(g)+p(b);
}

function _mixWhite(hex,ratio){

  var c=_hexToRgb(hex);

  if(c.some(isNaN)){
    return null;
  }

  return _rgbToHex(
    c[0]+(255-c[0])*ratio,
    c[1]+(255-c[1])*ratio,
    c[2]+(255-c[2])*ratio
  );
}

function getLight(c){
  return LIGHT_MAP[c.toLowerCase()] || _mixWhite(c,0.9) || '#f9f9f9';
}

function getBorder(c){
  return BORDER_MAP[c.toLowerCase()] || _mixWhite(c,0.55) || '#ddd';
}

function inlinemd(text){

  var ac=SC.accent;

  text=text.replace(
    /\*\*(.+?)\*\*/g,
    '<b style="color:'+ac+';">$1</b>'
  );

  text=text.replace(
    /\*(.+?)\*/g,
    '<i>$1</i>'
  );

  text=text.replace(
    /\[([^\]]+)\]\(([^)]+)\)/g,
    '<a href="$2" target="_blank" style="color:'+ac+';text-decoration:none;">$1</a>'
  );

  return text;
}

function makeToc(items){

  if(!items.length){
    return '';
  }

  var c=SC.toc;
  var cl=getLight(c);
  var cb=getBorder(c);

  if(tocStyle==='box'){

    var inner=
      '<b style="color:'+c+';">목차</b><br><br>';

    items.forEach(function(t,idx){

      inner+=
        '▸ '+
        t+
        (
          idx<items.length-1
            ? '<br>'
            : ''
        );
    });

    return (
      '<div style="background:'+
      cl+
      ';border:1px solid '+
      cb+
      ';border-radius:8px;padding:14px 18px;margin:16px 0 24px;color:#333;font-size:14px;line-height:2;">'+
      inner+
      '</div>'
    );
  }

  if(tocStyle==='line'){

    var inner2=
      '<b style="color:'+c+';">목차</b><br><br>';

    items.forEach(function(t,idx){

      inner2+=
        '- '+
        t+
        (

            : ''
        );
    });

    return (
      '<div style="border-left:4px solid '+

      '<div style="margin:16px 0 24px;line-height:2.4;">'+

        c+
        ';">'+
        (idx+1)+
        '.</b> '+
        inlinemd(it)+
        '</div>';
    });

    olItems=[];
    inOl=false;
  }

  function flushUl(){

    if(!inUl){
      return;
    }

    out+=
      '<div style="background:'+
      cl+
      ';border:1px solid '+
      cb+
      ';border-radius:8px;padding:14px 18px;margin:12px 0;">';

    ulItems.forEach(function(it){

      out+=
        '<div style="font-size:14.5px;color:#333;line-height:2;padding-left:18px;position:relative;">'+
        '<span style="color:'+
        c+
        ';position:absolute;left:0;font-weight:bold;">✔</span>'+
        inlinemd(it)+
        '</div>';
    });

    out+='</div>';

    ulItems=[];
    inUl=false;
  }

  function flushTable(){

    if(!inTable || !tableRows.length){
      return;
    }

    var ts=tableStyle;
    var tc=SC.table;
    var tcl=getLight(tc);
    var tcb=getBorder(tc);

    out+=
      '<table style="width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;">';

    tableRows.forEach(function(row,ri){

      if(/^[\|\s\-:]+$/.test(row)){
        return;
      }

      var cells=row
        .split('|')
        .map(function(s){
          return s.trim();
        })
        .filter(Boolean);

      if(!cells.length){
        return;
      }

      var rowBg='';

      if(ri!==0){

        if(ts==='default'){

          rowBg=
            ri%2===0
              ? '#ffffff'
              : '#fafafa';

        }else if(ts==='minimal'){

          rowBg=
            ri%2===0
              ? '#ffffff'
              : tcl;

        }else{

          rowBg='#ffffff';
        }
      }

      out+='<tr>';

      cells.forEach(function(cell){

        if(ri===0){

          var thBg=tc;
          var thColor='#fff';
          var thBd='1px solid '+tc;

          if(ts==='minimal'){

            thBg=tcl;
            thColor=tc;
            thBd='1px solid '+tcb;
          }

          if(ts==='dark'){

            thBg='#333';
            thColor='#fff';
            thBd='1px solid #333';
          }

          if(ts==='border'){

            thBg='#fff';
            thColor=tc;
            thBd='2px solid '+tc;
          }

          if(ts==='clean'){

            thBg=tcl;
            thColor=tc;
            thBd='none';
          }

          out+=
            '<th style="background:'+
            thBg+
            ';color:'+
            thColor+
            ';padding:10px 14px;text-align:center;border:'+
            thBd+
            ';">'+
            inlinemd(cell)+
            '</th>';

        }else{

          var tdBd=
            ts==='border'
              ? '1px solid '+tc
              : ts==='clean'
                ? 'none'
                : '1px solid '+tcb;

          out+=
            '<td style="border:'+
            tdBd+
            ';padding:10px 14px;text-align:center;color:#333;background:'+
            rowBg+
            ';">'+
            inlinemd(cell)+
            '</td>';
        }
      });

      out+='</tr>';
    });

    out+='</table>';

    tableRows=[];
    inTable=false;
  }

  while(i<lines.length){

    var t=lines[i].trim();

    if(
      t==='---' ||
      t==='***' ||
      t==='___'
    ){
      i++;
      continue;
    }

    if(t.startsWith('|')){

      flushOl();
      flushUl();

      inTable=true;

      tableRows.push(t);

      i++;
      continue;

    }else{

      flushTable();
    }

    var qM=
      t.match(
        /^\*{0,4}Q\.\s*\*{0,4}(.+)/
      );

    if(qM){

      flushOl();
      flushUl();

      inQA=true;

      qaQ=
        qM[1]
          .replace(/\*+/g,'')
          .trim();

      i++;
      continue;
    }

    if(inQA){

      var aM=
        t.match(
          /^\*{0,4}A\.\s*\*{0,4}(.+)/
        );

      if(aM){

        var ans=
          aM[1]
            .replace(/\*+/g,'')
            .trim();

        out+=
          '<div style="border:1px solid '+
          cb+
          ';border-radius:8px;margin:10px 0;overflow:hidden;">'+
          '<div style="background:'+
          cl+
          ';padding:12px 16px;font-size:14.5px;font-weight:bold;color:#111;">'+
          '<span style="color:'+
          c+
          ';font-weight:900;">Q.</span> '+
          inlinemd(qaQ)+
          '</div>'+
          '<div style="padding:12px 16px;font-size:14px;color:#444;line-height:1.85;">'+
          '<span style="color:'+
          c+
          ';font-weight:700;">A.</span> '+
          inlinemd(ans)+
          '</div>'+
          '</div>';

        inQA=false;

        i++;
        continue;

      }else if(t===''){

        inQA=false;
      }
    }

    if(t.startsWith('## ')){

      flushOl();
      flushUl();

      out+=
        makeH2(
          t.slice(3),
          'sec'+(++h2c)
        );

    }else if(t.startsWith('### ')){

      flushOl();
      flushUl();

      out+=makeH3(
        t.slice(4)
      );

    }else if(t.startsWith('> ')){

      flushOl();
      flushUl();

      out+=
        '<div style="background:'+
        cl+
        ';border:1px dashed '+
        c+
        ';border-radius:6px;padding:10px 14px;margin:14px 0;font-size:14px;line-height:1.8;color:#555;">'+
        inlinemd(
          t.slice(2)
        )+
        '</div>';

    }else if(
      t.startsWith('- ') ||
      t.startsWith('* ')
    ){

      flushOl();

      inUl=true;

      ulItems.push(
        t.slice(2)
      );

    }else if(
      /^\d+\.\s/.test(t)
    ){

      flushUl();

      inOl=true;

      olItems.push(
        t.replace(
          /^\d+\.\s/,
          ''
        )
      );

    }else if(t===''){

      flushOl();
      flushUl();

    }else if(
      /^#{1,6}\s/.test(t)
    ){

      flushOl();
      flushUl();

      out+=
        '<p style="font-size:15px;line-height:1.9;color:#333;margin:10px 0;">'+
        inlinemd(
          t.replace(
            /^#+\s*/,
            ''
          )
        )+
        '</p>';

    }else{

      flushOl();
      flushUl();

      out+=
        '<p style="font-size:15px;line-height:1.9;color:#333;margin:10px 0;">'+
        inlinemd(t)+
        '</p>';
    }

    i++;
  }

  flushOl();
  flushUl();
  flushTable();

  var ctaHtml='';

  var ctaC=SC.cta;
  var ctaL=getLight(ctaC);

  if(showCta){

    ctaHtml=
      '<div style="background:'+
      ctaL+
      ';border:1px solid '+
      ctaC+
      ';border-radius:8px;padding:16px;margin:20px 0;text-align:center;font-size:14.5px;line-height:1.9;">'+
      '<a href="'+
      cu1+
      '" target="_blank" style="color:'+
      ctaC+
      ';font-weight:bold;text-decoration:none;">'+
      ct1+
      '</a>'+
      (
        ct2
          ? '&nbsp;&nbsp;<a href="'+
            cu2+
            '" target="_blank" style="color:'+
            ctaC+
            ';font-weight:bold;text-decoration:none;">'+
            ct2+
            '</a>'
          : ''
      )+
      '</div>';
  }

  var firstLine='';

  for(var j=0;j<lines.length;j++){

    var l2=lines[j].trim();

    if(
      l2 &&
      !/^[#>|!\-\*]/.test(l2) &&
      !/^\d+\./.test(l2)
    ){

      firstLine=
        l2.replace(
          /\*\*/g,
          ''
        );

      break;
    }
  }

  return {
    toc:tocHtml,
    body:out,
    cta:ctaHtml,
    title:firstLine
  };
}

  var ok=

var SAMPLE=`선불폰도 핫스팟 되나요? 앤텔레콤 테더링 사용법

"선불폰은 핫스팟이 안 된다고 들었어요."

아니에요. 앤텔레콤 선불폰은 개통 후 핫스팟을 사용할 수 있어요.

## 핫스팟, 어떻게 켜요?

폰 설정에서 개인용 핫스팟(테더링)을 켜고 와이파이 비밀번호 설정한 뒤 노트북이나 태블릿을 연결하면 돼요.

단, 핫스팟 사용 시 데이터는 요금제 기본 제공량에서 차감돼요.

## 요금제별로 이렇게 달라요

| 요금제 | 기본 데이터 | 소진 후 속도 | 핫스팟 활용도 |
|---|---|---|---|
| 기본1 (12,100원) | 300MB | 차단 | 핫스팟 거의 불가 |
| 396 (39,600원) | 10.3GB | 3Mbps 무제한 | 가벼운 사용 가능 |
| 459 (45,900원) | 20.3GB | 3Mbps 무제한 | 넉넉하게 사용 가능 |

3Mbps면 유튜브 일반 화질, 카카오톡, 인터넷 서핑은 무리 없이 돼요.

## 핫스팟 쓸 때 이것만 챙기세요

- 장시간 사용하면 배터리 소모가 많아요.
- 핫스팟 연결 시 기본 데이터 소진 속도가 빨라질 수 있어요.
- 데이터 사용량을 확인하면서 사용하는 것이 좋아요.

## Q&A

Q. 앤텔레콤 선불폰 핫스팟 가능한 요금제는?
A. 데이터 제공량과 소진 후 속도를 확인해서 선택하면 됩니다.

Q. 3Mbps로 영상 통화 되나요?
A. 사용 환경과 영상 품질에 따라 차이가 있을 수 있습니다.`;

function showMobilePanel(
  panelClass,
  btn
){

  if(window.innerWidth>900){
    return;
  }

  document.querySelectorAll(
    '.left,.mid,.preview-panel'
  ).forEach(function(el){

    el.classList.remove(
      'mobile-on'
    );
  });

  var target=
    document.querySelector(
      '.'+panelClass
    );

  if(target){

    target.classList.add(
      'mobile-on'
    );
  }

  document.querySelectorAll(
    '.mobile-tab'
  ).forEach(function(x){

    x.classList.remove(
      'on'
    );
  });

  btn.classList.add(
    'on'
  );

  if(
    panelClass==='preview-panel'
  ){

    autoPreview();
  }
}

function syncResponsivePanels(){

  if(window.innerWidth<=900){

    var active=
      document.querySelector(
        '.mobile-tab.on'
      );

    var cls=
      active
        ? active.dataset.panel
        : 'mid';

    document.querySelectorAll(
      '.left,.mid,.preview-panel'
    ).forEach(function(el){

      el.classList.remove(
        'mobile-on'
      );
    });

    var target=
      document.querySelector(
        '.'+cls
      );

    if(target){

      target.classList.add(
        'mobile-on'
      );
    }

  }else{

    document.querySelectorAll(
      '.left,.mid,.preview-panel'
    ).forEach(function(el){

      el.classList.remove(
        'mobile-on'
      );
    });
  }
}

window.addEventListener(
  'resize',
  syncResponsivePanels
);

window.addEventListener(
  'orientationchange',
  function(){

    setTimeout(
      syncResponsivePanels,
      150
    );
  }
);

try{

  var saved=
    localStorage.getItem(
      'cafe_blog_builder_v9_draft'
    );

  if(saved){

    document.getElementById(
      'editor'
    ).value=saved;
  }

}catch(e){}

document.getElementById(
  'cnt'
).textContent=
  document.getElementById(
    'editor'
  ).value.length.toLocaleString()+
  '자';

syncResponsivePanels();
autoPreview();

</script>
